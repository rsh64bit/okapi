[package]
name = "okapi"
version = "0.1.0"
edition = "2024"

# The kernel tree follows Linux's top-level taxonomy (arch/, kernel/,
# drivers/, lib/, include/, init/) rather than Cargo's default src/.
# See doc/conventions.md.
[[bin]]
name = "okapi"
path = "init/main.rs"

[dependencies]
riscv = "0.16"
riscv-rt = "0.18"
panic-halt = "0.2"
